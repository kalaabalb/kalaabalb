<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="330" viewBox="0 0 1180 330" role="img" aria-labelledby="title desc">
  <title id="title">kalaab Alex hero banner</title>
  <desc id="desc">Light mode hero banner for the GitHub profile README.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="52%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#D6E4E2" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0891B2" />
      <stop offset="50%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="22" />
    </filter>
  </defs>

  <rect width="1180" height="330" rx="28" fill="url(#bg)" />
  <circle cx="955" cy="86" r="160" fill="#22D3EE" opacity="0.12" filter="url(#blur)" />
  <circle cx="225" cy="244" r="100" fill="#7C3AED" opacity="0.10" filter="url(#blur)" />
  <circle cx="1050" cy="250" r="130" fill="#059669" opacity="0.08" filter="url(#blur)" />

  <rect x="54" y="48" width="650" height="234" rx="24" fill="#FFFFFF" stroke="#CBD5E1" />
  <text x="84" y="110" fill="#0F172A" font-family="Inter, Arial, sans-serif" font-size="52" font-weight="800">
    kalaab Alex
  </text>
  <text x="84" y="148" fill="#0EA5A4" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="1.2">
    FRONTEND &amp; BACKEND DEVELOPER
  </text>
  <text x="84" y="184" fill="#334155" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="400">
    Flutter / React / Node.js / Firebase
  </text>
  <text x="84" y="216" fill="#475569" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="400">
    Clean builds, calm interfaces, reliable systems.
  </text>

  <rect x="748" y="54" width="376" height="222" rx="24" fill="#0F172A" opacity="0.96" />
  <text x="780" y="100" fill="#22D3EE" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="1.4">
    CURRENT FOCUS
  </text>
  <text x="780" y="144" fill="#F8FAFC" font-family="Inter, Arial, sans-serif" font-size="27" font-weight="700">
    Flutter apps
  </text>
  <text x="780" y="178" fill="#F8FAFC" font-family="Inter, Arial, sans-serif" font-size="27" font-weight="700">
    and backend services
  </text>
  <text x="780" y="218" fill="#CBD5E1" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="400">
    Building products that feel intentional.
  </text>
  <rect x="780" y="236" width="290" height="1.5" fill="url(#accent)" opacity="0.9" />
