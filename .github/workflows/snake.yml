name: Generate contribution snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/snake.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: kalaabalb
          outputs: |
            dist/snake-dark.svg?color_snake=#54b7b2&color_dots=#0a1817,#153f3b,#2a7a71,#54b7b2,#d39a52
            dist/snake-light.svg?color_snake=#0f6e56&color_dots=#f7f4ee,#cfe6df,#7ab6a7,#0f6e56,#95611f

      - name: Publish output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
          keep_history: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
