name: Generate contribution snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/snake.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: kalaabalb
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#54b7b2&color_dots=#070f0e,#0a1817,#8fc97f,#d39a52,#54b7b2
            dist/snake-light.svg?palette=github-light&color_snake=#0f6e56&color_dots=#f7f4ee,#ffffff,#3b6d11,#95611f,#0f6e56

      - name: Publish output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
          keep_history: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
