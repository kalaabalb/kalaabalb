<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="330" viewBox="0 0 1180 330" role="img" aria-labelledby="title desc">
  <title id="title">kalaab Alex hero banner</title>
  <desc id="desc">Dark mode hero banner for the GitHub profile README.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050816" />
      <stop offset="55%" stop-color="#0A101F" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="50%" stop-color="#A78BFA" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" />
    </filter>
  </defs>

  <rect width="1180" height="330" rx="28" fill="url(#bg)" />
  <circle cx="955" cy="86" r="160" fill="#22D3EE" opacity="0.14" filter="url(#blur)" />
  <circle cx="225" cy="244" r="100" fill="#A78BFA" opacity="0.10" filter="url(#blur)" />
  <circle cx="1050" cy="250" r="130" fill="#10B981" opacity="0.08" filter="url(#blur)" />

  <rect x="54" y="48" width="650" height="234" rx="24" fill="#0B1222" stroke="#23314A" />
  <text x="84" y="110" fill="#F8FAFC" font-family="Inter, Arial, sans-serif" font-size="52" font-weight="800">
    kalaab Alex
  </text>
  <text x="84" y="148" fill="#22D3EE" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="1.2">
    FRONTEND &amp; BACKEND DEVELOPER
  </text>
  <text x="84" y="184" fill="#CBD5E1" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="400">
    Flutter / React / Node.js / Firebase
  </text>
  <text x="84" y="216" fill="#94A3B8" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="400">
    Clean builds, calm interfaces, reliable systems.
  </text>

  <rect x="748" y="54" width="376" height="222" rx="24" fill="#08101D" opacity="0.98" stroke="#23314A" />
  <text x="780" y="100" fill="#A78BFA" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="1.4">
    CURRENT FOCUS
  </text>
  <text x="780" y="144" fill="#F8FAFC" font-family="Inter, Arial, sans-serif" font-size="27" font-weight="700">
    Flutter apps
  </text>
  <text x="780" y="178" fill="#F8FAFC" font-family="Inter, Arial, sans-serif" font-size="27" font-weight="700">
    and backend services
  </text>
  <text x="780" y="218" fill="#94A3B8" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="400">
    Building products that feel intentional.
  </text>
  <rect x="780" y="236" width="290" height="1.5" fill="url(#accent)" opacity="0.9" />
