-spacing="0.8" fill="#9a5f1c">CONVERSE</text><text x="96" y="458" text-anchor="start" font-size="12" font-weight="400" letter-spacing="0.8" fill="#5d5470">RESOLVED</text><text x="96" y="478" text-anchor="start" font-size="14" font-weight="400" letter-spacing="0.0" fill="#1d1730">open a communication boundary</text><text x="96" y="498" text-anchor="start" font-size="12" font-weight="400" letter-spacing="0.4" fill="#9d93b6">orientation prepared; transfer withheld</text><text x="96" y="528" text-anchor="start" font-size="12" font-weight="400" letter-spacing="0.6" fill="#9d93b6">LATENT UNTIL HANDOFF: the actual external transfer, contact endpoint, or outbound message</text><text x="1002" y="438" text-anchor="end" font-size="12" font-weight="400" letter-spacing="0.9" fill="#9a5f1c">ORIENTED</text><g id="interface-converse-diagram"><rect x="620" y="426" width="388" height="74" rx="14" fill="none" stroke="#d8cfef" stroke-width="1"/><path d="M 662 444 H 766 V 482 H 662" fill="none" stroke="#9a5f1c" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.74"/><path d="M 966 444 H 862 V 482 H 966" fill="none" stroke="#15803d" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.74"/><line x1="766" y1="463" x2="862" y2="463" stroke="#b9a3f7" stroke-width="1.2" stroke-opacity="0.52"/><circle cx="814" cy="463" r="4.6" fill="#0891b2" opacity="0.9"/><circle cx="814" cy="463" r="12.5" fill="none" stroke="#0891b2" stroke-width="1" stroke-opacity="0.20"/><text x="798" y="496" text-anchor="middle" font-size="10" letter-spacing="1.4" fill="#9d93b6">BOUNDARY PREPARED</text></g></g></svg>