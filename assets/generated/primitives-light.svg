<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" role="img" aria-labelledby="title desc"><title id="title">KalaOS primitive library (light)</title><desc id="desc">Reusable SVG primitives for grids, rulers, marks, corners, masks, and particles.</desc><defs><pattern id="kalaos-grid" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M 8 0 H 0 V 8" fill="none" stroke="rgba(157, 147, 182, 0.10)" stroke-opacity="1" stroke-width="1"/></pattern><symbol id="kalaos-corner-geometry" viewBox="0 0 64 64"><path d="M8 22V8H22" fill="none" stroke="#7c3aed" stroke-width="2" stroke-linecap="round"/><path d="M42 8H56V22" fill="none" stroke="#7c3aed" stroke-width="2" stroke-linecap="round"/><path d="M8 42V56H22" fill="none" stroke="#7c3aed" stroke-width="2" stroke-linecap="round"/><path d="M42 56H56V42" fill="none" stroke="#7c3aed" stroke-width="2" stroke-linecap="round"/></symbol><symbol id="kalaos-ruler" viewBox="0 0 240 20"><line x1="0" y1="10" x2="240" y2="10" stroke="#d8cfef" stroke-width="1"/><line x1="24" y1="5" x2="24" y2="15" stroke="#0891b2" stroke-width="1"/><line x1="120" y1="3" x2="120" y2="17" stroke="#7c3aed" stroke-width="1.5"/><line x1="216" y1="5" x2="216" y2="15" stroke="#9a5f1c" stroke-width="1"/></symbol><symbol id="kalaos-calibration-marks" viewBox="0 0 64 64"><circle cx="32" cy="32" r="20" fill="none" stroke="#d8cfef" stroke-width="1"/><line x1="32" y1="8" x2="32" y2="20" stroke="#0891b2" stroke-width="1"/><line x1="32" y1="44" x2="32" y2="56" stroke="#0891b2" stroke-width="1"/><line x1="8" y1="32" x2="20" y2="32" stroke="#0891b2" stroke-width="1"/><line x1="44" y1="32" x2="56" y2="32" stroke="#0891b2" stroke-width="1"/></symbol><symbol id="kalaos-separator" viewBox="0 0 240 8"><line x1="0" y1="4" x2="240" y2="4" stroke="#d8cfef" stroke-width="1"/><line x1="102" y1="4" x2="138" y2="4" stroke="#7c3aed" stroke-width="1"/></symbol><symbol id="kalaos-particle" viewBox="0 0 8 8"><circle cx="4" cy="4" r="1.25" fill="#7c3aed"/></symbol><symbol id="kalaos-origin-mark" viewBox="0 0 64 64"><line x1="32.0" y1="2.0" x2="32.0" y2="22.0" stroke="#7c3aed" stroke-width="4.0" stroke-linecap="round" opacity="0"><animate attributeName="opacity" values="0;1" dur="0.20s" begin="0s" fill="freeze"/></line><line x1="32.0" y1="42.0" x2="32.0" y2="62.0" stroke="#7c3aed" stroke-width="4.0" stroke-linecap="round" opacity="0"><animate attributeName="opacity" values="0;1" dur="0.20s" begin="0.16s" fill="freeze"/></line><line x1="2.0" y1="32.0" x2="22.0" y2="32.0" stroke="#7c3aed" stroke-width="4.0" stroke-linecap="round" opacity="0"><animate attributeName="opacity" values="0;1" dur="0.20s" begin="0.32s" fill="freeze"/></line><line x1="42.0" y1="32.0" x2="62.0" y2="32.0" stroke="#7c3aed" stroke-width="4.0" stroke-linecap="round" opacity="0"><animate attributeName="opacity" values="0;1" dur="0.20s" begin="0.48s" fill="freeze"/></line><circle cx="32.0" cy="32.0" r="4.0" fill="#7c3aed" opacity="0"><animate attributeName="opacity" values="0;1" dur="0.20s" begin="0.64s" fill="freeze"/></circle></symbol><clipPath id="kalaos-clip-frame"><rect x="24" y="24" width="1132" height="562" rx="20"/></clipPath><mask id="kalaos-soft-mask"><rect x="0" y="0" width="1180" height="610" fill="white"/><rect x="24" y="24" width="1132" height="562" rx="20" fill="black" opacity="0.08"/></mask></defs><rect width="480" height="480" fill="#f5f0ff" opacity="0"/></svg>