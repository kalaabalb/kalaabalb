<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">kalaab Alex profile header</title>
  <desc id="desc">Dark teal hero banner with amber accents for the GitHub profile README.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#071516" />
      <stop offset="48%" stop-color="#11383a" />
      <stop offset="100%" stop-color="#1a2020" />
    </linearGradient>
    <radialGradient id="glow" cx="70%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#54b7b2" stop-opacity="0.55" />
      <stop offset="55%" stop-color="#54b7b2" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#54b7b2" stop-opacity="0" />
    </radialGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" />
    </filter>
  </defs>

  <rect width="1200" height="320" rx="28" fill="url(#bg)" />
  <circle cx="960" cy="84" r="176" fill="url(#glow)" />
  <circle cx="220" cy="250" r="110" fill="#d39a52" opacity="0.10" filter="url(#blur)" />
  <circle cx="1080" cy="250" r="140" fill="#d39a52" opacity="0.08" filter="url(#blur)" />
  <rect x="770" y="44" width="350" height="232" rx="26" fill="#081315" fill-opacity="0.58" stroke="#d39a52" stroke-opacity="0.18" />

  <path d="M78 246C168 198 250 180 354 190C458 200 528 236 618 236C708 236 782 182 886 170C980 158 1084 186 1132 218"
        fill="none" stroke="#d39a52" stroke-opacity="0.35" stroke-width="2.2" stroke-linecap="round" />
  <path d="M78 258C168 212 250 194 354 204C458 214 528 248 618 248C708 248 782 194 886 182C980 170 1084 198 1132 230"
        fill="none" stroke="#f1e7d6" stroke-opacity="0.14" stroke-width="1.4" stroke-linecap="round" />

  <text x="72" y="118" fill="#f4efe7" font-family="Inter, Arial, sans-serif" font-size="54" font-weight="700" letter-spacing="0.4">
    kalaab Alex
  </text>
  <text x="72" y="162" fill="#d39a52" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="600" letter-spacing="1.4">
    FRONTEND &amp; BACKEND DEVELOPER
  </text>
  <text x="72" y="198" fill="#dfe5df" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="400">
    Flutter / Dart / React / Node.js / Firebase
  </text>
  <text x="72" y="232" fill="#c7d0cc" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="400">
    Clean builds, calm interfaces, reliable systems.
  </text>

  <g transform="translate(792 72)">
    <text x="0" y="0" fill="#d39a52" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="1.2">
      CURRENT FOCUS
    </text>
    <text x="0" y="42" fill="#f4efe7" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700">
      Flutter apps
    </text>
    <text x="0" y="76" fill="#f4efe7" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700">
      and backend services
    </text>
    <text x="0" y="118" fill="#c7d0cc" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="400">
      Building useful products with a polished finish.
    </text>
    <text x="0" y="154" fill="#c7d0cc" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="400">
      A profile that feels sharper, warmer, and more intentional.
    </text>
